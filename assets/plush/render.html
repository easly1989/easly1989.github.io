<!doctype html>
<meta charset="utf-8" />
<title>Plush pictures</title>
<!-- The pictures of the plush, drawn from plush.js (README.md): ?view=bench, lying on the mat seen
     from above; ?view=wall, hanging on the room's back wall as the room draws it, its still picture
     without WebGL; ?view=look, the view it was approved in. render.py saves them. -->
<style>
  body {
    margin: 0;
    background: transparent;
  }
</style>
<script>
  addEventListener("error", (e) => (window.failed = e.message + " " + e.filename + ":" + e.lineno));
</script>
<script type="importmap">
  {
    "imports": {
      "three": "../../vendor/three/build/three.module.min.js",
      "../../vendor/three/build/three.core.js": "../../vendor/three/build/three.core.min.js",
      "three/addons/": "../../vendor/three/examples/jsm/"
    }
  }
</script>
<canvas id="c"></canvas>
<script type="module">
  import * as THREE from "three";
  import { plush, look, shadow, flat, onPlane, WIDTH, ON_WALL } from "./plush.js";

  const q = new URLSearchParams(location.search),
    view = q.get("view") || "look",
    RATIO = 2; // (the pictures at twice their size, sharp on a dense screen)
  const c = document.getElementById("c");
  const renderer = new THREE.WebGLRenderer({ canvas: c, antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setClearColor(0, 0);
  renderer.setPixelRatio(RATIO);
  const scene = new THREE.Scene();
  const toy = plush();
  const V = (...a) => new THREE.Vector3(...a);
  let cam;
  if (view === "wall") {
    // in the plane of the wall, in its px, as room-plush.js holds it
    const { S, left, up, scale } = ON_WALL;
    const holder = new THREE.Group();
    holder.matrixAutoUpdate = false;
    holder.matrix.copy(onPlane(scale, left, up));
    holder.add(toy.root);
    scene.add(holder);
    look(renderer, scene, { up: V(0, 1, 0), left: V(-1, 0, 0), front: V(0, 0, 1) });
    cam = new THREE.OrthographicCamera();
    flat(cam, { p: 1, q: 1, x0: 0, y0: 0, S, R: 4 * S });
    renderer.setSize(S, S);
  } else if (view === "bench") {
    // from above, its head to the top, a little turned, the cord running off to its right; px a
    // unit as on the bench (index.html, .plush)
    const PX = 124 / WIDTH;
    toy.lie();
    toy.root.rotation.order = "YXZ"; // (turned about the mat's up, once it lies on it)
    toy.root.rotation.y = 0.05;
    scene.add(toy.root);
    look(renderer, scene, { up: V(0, 1, 0), left: V(-1, 0, 0), front: V(0, 0, -1) });
    toy.root.updateMatrixWorld(true);
    const b = new THREE.Box3().setFromObject(toy.root).expandByScalar(0.05);
    cam = new THREE.OrthographicCamera(b.min.x, b.max.x, -b.min.z, -b.max.z, 0.1, 50);
    cam.position.set(0, 10, 0);
    cam.up.set(0, 0, -1);
    cam.lookAt(0, 0, 0);
    renderer.setSize(Math.round((b.max.x - b.min.x) * PX), Math.round((b.max.z - b.min.z) * PX));
  } else {
    // the room's isometric view of the back wall, its front facing down and to the right
    const k = 1.9;
    cam = new THREE.OrthographicCamera(-k * 0.8, k * 0.8, k, -k, 0.1, 50);
    cam.position.set(-6, 6.6, 6);
    cam.lookAt(0, 0.95, 0);
    scene.add(toy.root);
    look(renderer, scene, { up: V(0, 1, 0), left: V(-1, 0, 0), front: V(0, 0, 1) });
    renderer.setPixelRatio(1);
    renderer.setSize(800, 1000);
  }
  renderer.render(scene, cam);
  // the picture, over its shadow on the wall
  const out = document.createElement("canvas");
  out.id = "out";
  out.width = c.width;
  out.height = c.height;
  const pen = out.getContext("2d");
  if (view === "wall") shadow(pen, c, RATIO);
  pen.drawImage(c, 0, 0);
  document.body.append(out);
  window.size = [c.width / RATIO, c.height / RATIO];
  window.done = true;
</script>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Terminal</title>
    <meta name="theme-color" content="#cfc5ab" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3'/%3E%3Cpath d='M4 5l3 3-3 3M8 11h4' stroke='%2352ff7d' stroke-width='1.6' fill='none'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
    <style>
      /* The old computer seen from its chair: the case all round, and the tube in
         it. One green phosphor on black, the same in both colour schemes, because
         that is what the tube can show; the case is plastic, also in both. */
      :root {
        --ph: #52ff7d;
        --dim: #2fae55;
        --glow: rgba(82, 255, 125, 0.5);
        --bz: clamp(12px, 3.4vmin, 44px);
        --deck: clamp(72px, 13vmin, 128px);
        color-scheme: dark;
      }
      @view-transition {
        navigation: auto;
      }
      @media (prefers-reduced-motion: reduce) {
        @view-transition {
          navigation: none;
        }
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        overflow: hidden;
        background: linear-gradient(#e2dac6, #c9bfa5);
        color: var(--ph);
        font: 400 clamp(20px, 0.9rem + 0.85vw, 30px) / 1.15 "VT323", ui-monospace, monospace;
      }
      .vh {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      .crt {
        position: fixed;
        inset: var(--bz) var(--bz) calc(var(--bz) + var(--deck));
        overflow: hidden;
        display: flex;
        flex-direction: column;
        padding: max(5vh, 22px) max(5vw, 16px) max(3.5vh, 16px);
        border-radius: 3.5vmin / 4.5vmin;
        background: radial-gradient(ellipse at 50% 48%, #062a12 0%, #021007 62%, #000 100%);
        box-shadow:
          0 0 0 clamp(5px, 1.2vmin, 12px) #35332d,
          0 0 0 clamp(7px, 1.6vmin, 15px) #b4aa8f;
        text-shadow:
          0 0 1px var(--ph),
          0 0 7px var(--glow),
          0 0 18px rgba(82, 255, 125, 0.22);
        view-transition-name: crt;
      }
      /* horizontal scan lines, and the vertical grille of the phosphor */
      .crt::before,
      .crt::after,
      .crt > i,
      .crt > .crack {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 3;
        pointer-events: none;
      }
      .crt::before {
        background:
          repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.32) 0 1px, transparent 1px 3px),
          repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.18) 0 1px, transparent 1px 3px);
      }
      /* the tube curves away at its edges */
      .crt::after {
        z-index: 4;
        border-radius: inherit;
        background: radial-gradient(ellipse at 50% 50%, transparent 58%, rgba(0, 0, 0, 0.55) 100%);
        box-shadow:
          inset 0 0 6vmin 1.5vmin rgba(0, 0, 0, 0.9),
          inset 0 0 0 1px rgba(82, 255, 125, 0.08);
      }
      /* a hum bar rolls down the picture and smears what it crosses */
      .crt > .hum {
        top: -20%;
        bottom: auto;
        height: 16%;
        background: linear-gradient(transparent, rgba(82, 255, 125, 0.05) 45%, rgba(82, 255, 125, 0.08) 55%, transparent);
        -webkit-backdrop-filter: blur(0.6px) brightness(1.25);
        backdrop-filter: blur(0.6px) brightness(1.25);
        animation: hum 9s linear infinite;
      }
      /* and a fainter band drifts across it, side to side */
      .crt > .drift {
        left: -12%;
        right: auto;
        width: 7%;
        background: linear-gradient(90deg, transparent, rgba(82, 255, 125, 0.035), transparent);
        -webkit-backdrop-filter: blur(0.4px);
        backdrop-filter: blur(0.4px);
        animation: drift 13s linear infinite;
      }
      .crt > .flicker {
        z-index: 5;
        background: rgba(82, 255, 125, 0.035);
        animation: flicker 0.16s steps(1) infinite;
      }
      @keyframes hum {
        to {
          transform: translateY(760%);
        }
      }
      @keyframes drift {
        to {
          transform: translateX(1900%);
        }
      }
      @keyframes flicker {
        0% {
          opacity: 0.6;
        }
        25% {
          opacity: 0.25;
        }
        50% {
          opacity: 0.9;
        }
        75% {
          opacity: 0.4;
        }
      }
      /* switched off from its own button: the picture shrinks to a line, then a dot */
      .off .crt {
        animation: crt-off 0.45s ease-in both;
      }
      @keyframes crt-off {
        55% {
          clip-path: inset(49.5% 0 round 3vmin);
          filter: brightness(3);
        }
        100% {
          clip-path: inset(49.5% 49.5% round 3vmin);
          filter: brightness(5);
        }
      }
      /* a program from behind a door, on the tube and under its scan lines */
      .crt > .app {
        position: absolute;
        inset: 0;
        z-index: 2;
        width: 100%;
        height: 100%;
        border: 0;
        background: transparent;
        color-scheme: dark;
      }
      .running .screen,
      .running .leave {
        visibility: hidden;
      }
      .screen {
        position: relative;
        z-index: 1;
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        scrollbar-width: none;
        animation: wobble 7s infinite;
      }
      /* now and then the picture slips sideways for a moment */
      @keyframes wobble {
        0%,
        61%,
        62.6%,
        93%,
        95.2%,
        100% {
          transform: none;
        }
        61.6% {
          transform: translateX(0.25vw);
        }
        93.6% {
          transform: translateX(0.5vw) skewX(-0.8deg);
        }
        94.3% {
          transform: translateX(-0.35vw) skewX(0.5deg);
        }
      }
      .log p {
        margin: 0;
        min-height: 1.15em;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      /* the word that matters, in reverse video */
      .log b {
        padding: 0 0.15em;
        background: var(--ph);
        color: #000;
        font-weight: inherit;
        text-shadow: none;
        box-shadow: 0 0 10px var(--glow);
      }
      .log .magic {
        color: #c4ffd2;
      }
      .line {
        position: relative;
        display: flex;
        white-space: pre;
      }
      .line.busy .cursor {
        animation: none;
        opacity: 0.4;
      }
      .line input {
        position: absolute;
        inset: 0;
        width: 100%;
        margin: 0;
        padding: 0;
        border: 0;
        background: none;
        color: transparent;
        caret-color: transparent;
        font: inherit;
        outline: none;
      }
      .typed {
        min-width: 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      /* what Tab offers, until Enter takes it */
      .typed u {
        text-decoration: none;
        background: rgba(82, 255, 125, 0.22);
      }
      /* a block cursor: solid and blinking while the line has focus, hollow when not */
      .cursor {
        outline: 1px solid var(--ph);
        outline-offset: -1px;
      }
      .line:focus-within .cursor {
        background: var(--ph);
        color: #000;
        text-shadow: none;
        box-shadow: 0 0 10px var(--glow);
        animation: blink 1.06s steps(1) infinite;
      }
      @keyframes blink {
        50% {
          background: transparent;
          color: var(--ph);
          box-shadow: none;
        }
      }
      .leave {
        position: relative;
        z-index: 1;
        align-self: flex-start;
        margin-top: 0.8em;
        color: var(--dim);
        text-decoration: none;
      }
      .leave:hover,
      .leave:focus-visible {
        color: var(--ph);
        text-decoration: underline;
      }
      :focus-visible {
        outline: 2px solid var(--ph);
        outline-offset: 4px;
      }

      /* ---- the front of the case, under the tube -------------------------- */
      .deck {
        position: fixed;
        left: calc(var(--bz) + 1vmin);
        right: calc(var(--bz) + 1vmin);
        bottom: 0;
        height: calc(var(--deck) + var(--bz) * 0.4);
        display: flex;
        align-items: center;
        gap: clamp(10px, 2.5vmin, 28px);
      }
      .deck :focus-visible {
        outline-color: #1e4fd6;
      }
      /* the floppy bay on the left, as on the bench */
      .badge {
        margin-left: auto;
        color: #8d846f;
        font-size: clamp(16px, 2.6vmin, 24px);
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5);
      }
      .drive,
      .power {
        position: relative;
        flex: none;
        padding: 0;
        border: 0;
        cursor: pointer;
      }
      /* the floppy bay, a 5.25" drive as big as the one on the bench: a slot, a
         lever, and its light */
      .drive {
        width: clamp(170px, 42vw, 520px);
        height: clamp(54px, 10vmin, 104px);
        border-radius: 4px;
        background: linear-gradient(#d3cab2, #bdb399);
        box-shadow:
          inset 0 0 0 1px rgba(0, 0, 0, 0.16),
          inset 0 -3px 0 rgba(0, 0, 0, 0.08);
      }
      .drive::before {
        content: "";
        position: absolute;
        left: 8%;
        right: 8%;
        top: 44%;
        height: 14%;
        border-radius: 3px;
        background: #2b2823;
      }
      /* a disk in the slot shows its edge */
      .drive[aria-pressed="true"]::before {
        background: linear-gradient(#2b2823 0 30%, #24426e 30%);
      }
      .drive::after {
        content: "";
        position: absolute;
        left: 44%;
        top: 26%;
        width: 12%;
        height: 50%;
        border-radius: 3px;
        background: linear-gradient(#9b917a, #7e7562);
        transition: transform 0.2s;
      }
      .drive[aria-pressed="true"]::after {
        transform: rotate(90deg);
      }
      .drive i {
        position: absolute;
        right: 6px;
        bottom: 6px;
        width: 9px;
        height: 5px;
        border-radius: 1px;
        background: #6a4a35;
      }
      /* a disk going in: it is held up with its label showing, then pushed through
         the slot, which hides whatever has gone past it */
      .well {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 49%;
        height: 0;
        clip-path: inset(-100vh -100vw 0 -100vw);
        pointer-events: none;
      }
      .floppy {
        position: absolute;
        left: 50%;
        bottom: 0;
        width: min(62%, 260px);
        aspect-ratio: 1;
        border-radius: 4px;
        background:
          radial-gradient(circle at 50% 58%, #2a2a2e 0 7%, #8b8b90 7% 8.5%, #141416 8.5% 15%, transparent 15.5%),
          radial-gradient(ellipse 4% 11% at 50% 88%, #6f6655 0 98%, transparent 100%),
          radial-gradient(circle at 69% 58%, #6f6655 0 2%, transparent 2.5%),
          #1c1c1f;
        box-shadow: 0 12px 26px rgba(0, 0, 0, 0.45);
        translate: -50% 0;
        transform-origin: 50% 100%;
        opacity: 0;
      }
      .floppy .tag {
        position: absolute;
        left: 8%;
        right: 8%;
        top: 6%;
        height: 26%;
        display: grid;
        place-items: center;
        border-top: 0.5em solid var(--tc, #d9453b);
        border-radius: 2px;
        background: repeating-linear-gradient(transparent 0 0.9em, rgba(60, 90, 160, 0.25) 0.9em calc(0.9em + 1px)), #f4efe0;
        color: #1d3c8f;
        font: 700 clamp(13px, 2.6vmin, 24px) / 1 "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
        text-shadow: none;
        text-align: center;
      }
      .floppy.in {
        animation: disk-in 1.4s cubic-bezier(0.3, 0.7, 0.3, 1) both;
      }
      .floppy.out {
        animation: disk-in 1.1s cubic-bezier(0.3, 0.7, 0.3, 1) reverse both;
      }
      @keyframes disk-in {
        0% {
          opacity: 0;
          transform: translateY(-28%) scale(0.92);
        }
        14%,
        52% {
          opacity: 1;
          transform: translateY(-36%);
        }
        74% {
          opacity: 1;
          transform: perspective(700px) translateY(-6%) rotateX(58deg);
        }
        100% {
          opacity: 1;
          transform: perspective(700px) translateY(105%) rotateX(80deg);
        }
      }
      .drive.reading i {
        animation: busy 0.22s steps(1) 6;
      }
      @keyframes busy {
        50% {
          background: #ff9a4d;
          box-shadow: 0 0 5px #ff9a4d;
        }
      }
      /* the speaker grille is its own mute button; muted, it shows a red dot */
      .speaker {
        position: relative;
        flex: none;
        width: 44px;
        height: 44px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: radial-gradient(circle, #6f6655 0 1.6px, transparent 2.2px) 0 0 / 7px 7px, #cdc3a9;
        box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.3);
        cursor: pointer;
      }
      .speaker[aria-pressed="true"]::after {
        content: "";
        position: absolute;
        right: 2px;
        top: 2px;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #d9453b;
      }
      .switch {
        position: relative;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .switch i {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #7dff9b;
        box-shadow: 0 0 7px #7dff9b;
      }
      .power {
        width: 44px;
        height: 44px;
        border-radius: 8px;
        background: linear-gradient(#6b6458, #47423a);
        box-shadow:
          0 2px 0 #2e2a24,
          inset 0 1px 0 rgba(255, 255, 255, 0.25);
      }
      .power:active {
        transform: translateY(2px);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2);
      }

      /* the clip plays on the same tube, in its own window */
      .nedry {
        width: min(88vw, calc(70dvh * 360 / 372));
        padding: 0;
        border: 2px solid var(--ph);
        background: #000;
        color: var(--ph);
        font: inherit;
        text-shadow: 0 0 7px var(--glow);
        box-shadow: 0 0 30px rgba(82, 255, 125, 0.35);
      }
      .nedry::backdrop {
        background: rgba(0, 0, 0, 0.55);
      }
      .nedry::after {
        content: "";
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.25) 0 1px, transparent 1px 3px);
        pointer-events: none;
      }
      .nedry header {
        display: flex;
        align-items: center;
        padding: 0.1em 0.2em 0.1em 0.5em;
        border-bottom: 2px solid var(--ph);
      }
      .nedry header span {
        flex: 1;
      }
      .nedry button {
        min-height: 44px;
        padding: 0 0.5em;
        border: 0;
        background: none;
        color: inherit;
        font: inherit;
        text-shadow: inherit;
        cursor: pointer;
      }
      .nedry .start {
        display: none;
      }
      .nedry.still .start {
        display: block;
      }
      .nedry video {
        display: block;
        width: 100%;
        aspect-ratio: 360 / 372;
        background: #000;
        filter: sepia(1) hue-rotate(70deg) saturate(2.2) brightness(0.95);
      }

      /* started any other way than from its computer: the tube cracks, burns red
         and halts */
      .fatal {
        --ph: #ff5a4e;
        --dim: #c9463c;
        --glow: rgba(255, 90, 78, 0.5);
      }
      .fatal .crt {
        background: radial-gradient(ellipse at 50% 48%, #2a0604 0%, #100201 62%, #000 100%);
        text-shadow:
          0 0 1px var(--ph),
          0 0 8px var(--glow);
      }
      .fatal .crt > i {
        display: none;
      }
      .fatal .switch i {
        background: #ff5a4e;
        box-shadow: 0 0 7px #ff5a4e;
      }
      .crt > .crack {
        z-index: 6;
        width: 100%;
        height: 100%;
        fill: none;
        stroke: rgba(255, 225, 220, 0.55);
        stroke-width: 1.4;
        display: none;
      }
      .crt > .crack path {
        vector-effect: non-scaling-stroke;
      }
      .crt > .crack path + path {
        fill: rgba(255, 225, 220, 0.12);
      }
      .fatal .crt > .crack {
        display: block;
      }
      .dead .switch i {
        animation: dead 0.5s steps(1) 2;
      }
      @keyframes dead {
        50% {
          opacity: 0.2;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .crt > i,
        .screen,
        .line:focus-within .cursor,
        .off .crt {
          animation: none;
        }
        .crt > i {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="crt">
      <h1 class="vh">Terminal</h1>
      <div class="screen">
        <div class="log" role="log" aria-live="polite"></div>
        <form class="line" autocomplete="off">
          <label class="vh" for="cmd">Command</label>
          <span class="ps1" aria-hidden="true"></span><span class="typed" aria-hidden="true"><span class="cursor"> </span></span>
          <input id="cmd" name="cmd" type="text" maxlength="80" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" />
        </form>
      </div>
      <a class="leave" href="index.html">Esc  Back to the bench</a>
      <i class="hum"></i><i class="drift"></i><i class="flicker"></i>
      <svg class="crack" aria-hidden="true" viewBox="0 0 100 75" preserveAspectRatio="none"><path d="M62 30 48 8M62 30 80 3M62 30 97 21M62 30 93 54M62 30 70 74M62 30 39 67M62 30 6 50M62 30 19 16M55 19 45 25M73 15 83 23M79 41 89 35M65 50 54 57M49 45 37 37M28 58 22 66M86 62 95 66" /><path d="M58 26 66 24 69 33 60 37Z" /></svg>
    </main>
    <div class="deck">
      <button class="drive" type="button" aria-pressed="false" aria-label="Floppy drive: insert a disk">
        <i></i><span class="well" aria-hidden="true"><span class="floppy"><span class="tag"></span></span></span>
      </button>
      <span class="badge" aria-hidden="true">bench 1.07</span>
      <button class="speaker" type="button" aria-pressed="false" aria-label="Mute the computer"></button>
      <span class="switch"><i aria-hidden="true"></i><button class="power" type="button" aria-label="Switch the computer off"></button></span>
    </div>

    <dialog class="nedry" aria-labelledby="nedry-title">
      <header>
        <span id="nedry-title">YOU DIDN'T SAY THE MAGIC WORD!</span>
        <button class="start" type="button">Play</button>
        <button class="shut" type="button" aria-label="Close the clip">X</button>
      </header>
      <video src="assets/tty0.mp4" loop playsinline preload="none" aria-label="Ah ah ah, you didn't say the magic word"></video>
    </dialog>

    <script src="crt.js"></script>
    <script>
      (function () {
        "use strict";
        // Three entries open only with their own command: the command is the key

            dir: "tax",
            color: "#c9a227",
            files: { "receipts.txt": "Coffee. Coffee. Floppy disks. Coffee." },
          },
          {
            label: "Photos (cat)",
            dir: "photos",
            color: "#9b4fd1",
            files: {
              "cat-001.gif": "GIF89a... it is the cat.",
              "cat-002.gif": "GIF89a... it is the cat again.",
              "cat-347.gif": "GIF89a... it is always the cat.",
            },
          },
          {
            label: "Secret!!",
            dir: "secret",
            color: "#222222",
            files: { "secret.txt": "If it were secret, it would not say so on the label." },
          },
        ];
        var FS = {
          bin: { cat: BIN, cd: BIN, clear: BIN, date: BIN, echo: BIN, help: BIN, history: BIN, ls: BIN, pwd: BIN, ssh: BIN, su: BIN, sudo: BIN, uname: BIN, whoami: BIN },
          dev: {
            null: "",
            cat: "purr",
            coffee: "Out of coffee. There is a mug on the bench.",
            modem: "Hayes compatible, 2400 baud.\nGet its attention, then dial by tone, then say who: AT, D, T, a name.",
          },
          etc: {
            hostname: "bench",
            hosts: "127.0.0.1  localhost bench\n10.0.0.2   ledger\n10.0.0.3   agenda\n10.0.0.66  isla-nublar",
            motd: "Welcome to BENCH/OS 1.07.\n640K conventional memory. One cat detected.",
            passwd: "root:x:0:0:the cat:/bench:/bin/purr\ncarlo:x:1000:1000:Carlo Ruggiero:/home/carlo:/bin/sh\nnedry:x:1993:1993:Dennis Nedry:/home/nedry:/bin/magicword",
          },
          home: {
            carlo: {
              "readme.txt": "This is the computer at the back of the bench.\nIt has been here longer than the cat.\nType help to see what it understands.\nNot everything it understands is in help.",
              "todo.txt": "[x] ship CloudBank 3\n[ ] finish everything else\n[ ] stop starting new projects\n[ ] feed the cat (again)",
              ".plan": "Three doors on this machine, and none of them opens with sudo.\nA game you run from a disk. A board you dial. A channel you tune.\nLowercase or not, it does not mind.",
              "phonebook.txt": "BOARDS I STILL CALL\n\n  the crew that met on mIRC ...... dial them by name, one word\n\n(the rest of the page is a coffee stain)",
              "tv-guide.txt":
                "TV GUIDE: ANIME ALL DAY\n\n" +
                "A whole world of anime, subtitled, on one channel.\n" +
                "The guide does not print its number. The channel is the port:\n" +
                "the one who finds everything sits on 9696, the crew took the next door,\n" +
                "and the anime took the one after that.",
              ".bash_history": "ls -a\ncat .plan\ncd /var/log\ncat auth.log\nsudo open the doors\n# no. words, not tools.\nclear",
              projects: {
                "cloudbank.txt": "CloudBank: a free, open-source, self-hosted personal finance manager.\nA web port of HomeBank. On the bench: the blue ledger.",
                "social-contacts-sync.txt": "Social Contacts Sync: a free, open-source desktop app that fills\nGoogle Contacts with profile photos. On the bench: the cards.",
                "planora.txt": "Planora: a shared activity planner for groups, in internal testing.\nOn the bench: the jar of ideas.",
                "nutreek.txt": "Nutreek: a self-hosted weekly nutrition planner.\nOn the bench: the agenda.",
                "cupid.txt": "Cupid: a management system for matchmaking agencies.\nOn the bench: the sealed envelope.",
              },
            },
            nedry: { "note.txt": "If anyone asks: I was never here." },
          },
          mnt: {},
          tmp: tmp,
          var: {
            log: {
              "auth.log": "02:14 tty1 nedry: access main security grid: DENIED\n02:15 tty1 nedry: sudo access: 3 incorrect password attempts\n02:16 tty1 nedry: ssh root@isla-nublar: DENIED\n23:58 tty1 carlo: a door opened (the words are not logged)\n23:59 tty1 carlo: 3 doors, 0 in help",
            },
          },
        };
        function parts(path) {
          var out = path.charAt(0) === "/" ? [] : cwd.split("/").filter(Boolean);
          if (path === "~" || path.indexOf("~/") === 0) {
            out = HOME.split("/").filter(Boolean);
            path = path.slice(1);
          }
          path.split("/").forEach(function (s) {
            if (!s || s === ".") return;
            if (s === "..") out.pop();
            else out.push(s);
          });
          return out;
        }
        function find(list) {
          var n = FS;
          for (var i = 0; i < list.length; i++) {
            if (typeof n !== "object" || !Object.prototype.hasOwnProperty.call(n, list[i])) return undefined;
            n = n[list[i]];
          }
          // anything under a disk's directory is read off the disk
          if (list[0] === "mnt" && list[1] && Date.now() - lastRead > 700) {
            lastRead = Date.now();
            reading(0.6);
          }
          return n;
        }
        function where(path) {
          return path === HOME ? "~" : path.indexOf(HOME + "/") === 0 ? "~" + path.slice(HOME.length) : path;
        }

        // ---- what it understands -------------------------------------------------
        var FACTS = [
          "Uptime: 37 days. The cat's: 41.",
          "Free memory: 38911 bytes.",
          "Disk A: 360K, of which 0K free.",
          "Load average: 0.01, 0.02, purr.",
          "Keyboard: 84 keys, two of them sticky.",
          "Last backup: never. Unlike CloudBank's.",
          "Screen: 80 columns, 25 rows, one colour.",
        ];
        var SAYINGS = {
          coffee: "Brewing... no water. Try the mug on the bench.",
          "doom.exe": "Not enough memory. 640K ought to be enough for anybody.",
          "screensaver.scr": "Toasters not found.",
          rm: "rm: the cat is sitting on that file.",
          man: "There is no manual. There is help.",
          vim: "You are now in vim. Just kidding: nobody gets out of vim.",
          ping: "PONG. The cat batted it back.",
        };
        var COMMANDS = {
          help: function () {
            say(
              "BENCH/OS 1.07. These commands are enabled:\n" +
                "  help, ?             this list\n" +
                "  whoami              who sits at this keyboard\n" +
                "  ls [-a] [dir]       what is in a directory\n" +
                "  cd [dir]            go to a directory\n" +
                "  cat <file>          show a file\n" +
                "  pwd                 where you are\n" +
                "  history             what you typed\n" +
                "  echo <text>         say something\n" +
                "  uname [-a]          about the system\n" +
                "  date                today\n" +
                "  sudo, su            become root (needs the password)\n" +
                "  ssh [user@]host     log in somewhere else\n" +
                "  eject               take the disk out of drive A:\n" +
                "  run <program>       start a program\n" +
                "  atdt <name>         dial out on the modem\n" +
                "  tune <channel>      the TV card\n" +
                "  sound [on|off]      the computer's noises\n" +
                "  clear               wipe the screen\n" +
                "  exit                back to the bench\n" +
                "Tab completes a word; Tab again offers the next; Enter takes it.\n\n" +
                pick(FACTS)
            );
          },
          whoami: function () {
            say(
              "carlo\n\n" +
                "Carlo Ruggiero. A software developer with more than a decade of experience; " +
                "by day a Full Stack Software Developer at TeamSystem. I build self-hosted web apps " +
                "and cross-platform mobile apps, mostly in Go. The projects on this bench are the ones " +
                "I keep going on my own time. Their notes are in ~/projects."
            );
          },
          ls: function (args) {
            var all = args[0] === "-a";
            if (all) args = args.slice(1);
            var path = args[0] || ".";
            var n = find(parts(path));
            if (n === undefined) return say("ls: cannot access '" + path + "': No such file or directory");
            if (typeof n !== "object") return say(path);
            var names = Object.keys(n)
              .filter(function (k) {
                return all || k.charAt(0) !== ".";
              })
              .sort()
              .map(function (k) {
                return typeof n[k] === "object" ? k + "/" : k;
              });
            if (all) names = ["./", "../"].concat(names);
            say(names.join("  "));
          },
          cd: function (args) {
            var list = parts(args[0] || "~");
            var n = find(list);
            if (n === undefined) return say("cd: " + args[0] + ": No such file or directory");
            if (typeof n !== "object") return say("cd: " + args[0] + ": Not a directory");
            cwd = "/" + list.join("/");
          },
          cat: function (args) {
            if (!args.length) return say("cat: missing file operand");
            args.forEach(function (a) {
              var n = find(parts(a));
              if (n === undefined) say("cat: " + a + ": No such file or directory");
              else if (typeof n === "object") say("cat: " + a + ": Is a directory");
              else if (n) say(n);
            });
          },
          pwd: function () {
            say(cwd);
          },
          history: function () {
            say(
              history
                .map(function (h, i) {
                  return ("    " + (i + 1)).slice(-5) + "  " + h;
                })
                .join("\n")
            );
          },
          echo: function (args) {
            say(args.join(" "));
          },
          uname: function (args) {
            say(args[0] === "-a" ? "BENCH/OS bench 1.07 #1 1987 i8088 640K one-cat" : "BENCH/OS");
          },
          date: function () {
            say(new Date().toString().slice(0, 24).toUpperCase());
          },
          clear: function () {
            log.textContent = "";
          },
          exit: function () {
            location.href = "index.html";
          },
          // No password is the right one. Three wrong ones and it says the magic word.
          sudo: function (args) {
            if (!args.length) return say("usage: sudo <command>");
            ask("[sudo] password for carlo: ", "Sorry, try again.", "sudo: " + TRIES + " incorrect password attempts");
          },
          su: function () {
            ask("Password: ", "su: Authentication failure", "su: Authentication failure");
          },
          ssh: function (args) {
            var to = args.filter(function (a) {
              return a.charAt(0) !== "-";
            })[0];
            if (!to) return say("usage: ssh [user@]host");
            if (to.indexOf("@") < 0) to = "carlo@" + to;
            ask(to + "'s password: ", "Permission denied, please try again.", to + ": Permission denied (publickey,password).");
          },
        };
        COMMANDS["?"] = COMMANDS["/help"] = COMMANDS.help;
        COMMANDS.cls = COMMANDS.clear;
        COMMANDS.logout = COMMANDS.exit;
        var LATER = {};
        var RUNS = {
          tetris: "TETRIS.COM: no colour adapter. The blocks would be falling in green.",
          doom: SAYINGS["doom.exe"],
          "doom.exe": SAYINGS["doom.exe"],
          "tetris.com": "TETRIS.COM: no colour adapter. The blocks would be falling in green.",
        };
        COMMANDS.run = function (args) {
          if (!args.length) return say("usage: run <program>");
          say(RUNS[args[0].toLowerCase()] || "run: " + args[0] + ": program not found");
        };
        // the modem dials out, and nobody answers
        COMMANDS.atdt = function (args) {
          if (!args.length) return say("ERROR");
          var who = args.join(" ");
          say("ATDT " + who.toUpperCase());
          var secs = CRT.dial(who, true) || 1.2;
          setTimeout(function () {
            say(pick(["BUSY", "NO CARRIER", "NO ANSWER"]));
            done();
          }, secs * 1000);
          return LATER;
        };
        // the TV card finds snow
        COMMANDS.tune = function (args) {
          if (!args.length) return say("usage: tune <channel>");
          CRT.snow(0.8);
          setTimeout(function () {
            say("CH " + args[0] + ": NO SIGNAL");
            done();
          }, 850);
          return LATER;
        };
        COMMANDS.eject = function () {
          if (swapping) return;
          if (!disk) return say("eject: no disk in drive A:");
          eject();
        };
        COMMANDS.sound = function (args) {
          var on = args[0] ? args[0] !== "off" : CRT.muted();
          sound(on);
          say("Sound " + (on ? "on." : "off."));
        };
        function ask(question, again, last) {
          asking = { ask: question, again: again, last: last, left: TRIES };
        }

        // ---- Tab ---------------------------------------------------------------
        // The word under the cursor: a command first, a path after it.
        function words(line) {
          var cut = line.lastIndexOf(" ") + 1;
          var head = line.slice(0, cut);
          var word = line.slice(cut);
          if (!head.trim()) {
            var names = Object.keys(COMMANDS).concat(Object.keys(SAYINGS));
            return {
              head: head,
              list: names
                .filter(function (n, i) {
                  return /^[a-z]/.test(n) && n.indexOf(word.toLowerCase()) === 0 && names.indexOf(n) === i;
                })
                .sort(),
            };
          }
          var slash = word.lastIndexOf("/") + 1;
          var dir = word.slice(0, slash);
          var base = word.slice(slash);
          var n = find(parts(dir || "."));
          var onlyDirs = head.trim().split(/\s+/)[0] === "cd";
          if (typeof n !== "object") return { head: head, list: [] };
          return {
            head: head,
            list: Object.keys(n)
              .filter(function (k) {
                return k.indexOf(base) === 0 && (base.charAt(0) === "." || k.charAt(0) !== ".") && (!onlyDirs || typeof n[k] === "object");
              })
              .sort()
              .map(function (k) {
                return dir + k + (typeof n[k] === "object" ? "/" : "");
              }),
          };
        }
        function complete(backwards) {
          if (!offer) {
            var w = words(input.value);
            if (!w.list.length) return;
            offer = { head: w.head, list: w.list, i: -1, was: input.value };
          }
          offer.i = (offer.i + (backwards ? -1 : 1) + offer.list.length) % offer.list.length;
          input.value = offer.head + offer.list[offer.i];
          input.setSelectionRange(input.value.length, input.value.length);
          mirror();
        }
        function take() {
          offer = null;
          mirror();
        }

        // ---- the three doors ------------------------------------------------------
        // Must match normalise() in seal.mjs.
        function normalise(s) {
          return s.trim().replace(/\s+/g, " ").toLowerCase();
        }
        function bytes(b64) {
          return Uint8Array.from(atob(b64), function (c) {
            return c.charCodeAt(0);
          });
        }
        // The entry this command opens, or null.
        function unseal(cmd) {
          var subtle = window.crypto && crypto.subtle;
          if (!subtle) return Promise.resolve(null);
          return subtle
            .importKey("raw", new TextEncoder().encode(cmd), "PBKDF2", false, ["deriveKey"])
            .then(function (base) {
              return subtle.deriveKey(
                { name: "PBKDF2", salt: bytes(VAULT.salt), iterations: VAULT.rounds, hash: "SHA-256" },
                base,
                { name: "AES-GCM", length: 256 },
                false,
                ["decrypt"]
              );
            })
            .then(function (key) {
              return Promise.all(
                VAULT.items.map(function (it) {
                  return subtle.decrypt({ name: "AES-GCM", iv: bytes(it.iv) }, key, bytes(it.ct)).then(
                    function (pt) {
                      return JSON.parse(new TextDecoder().decode(pt));
                    },
                    function () {
                      return null;
                    }
                  );
                })
              );
            })
            .then(function (found) {
              return found.filter(Boolean)[0] || null;
            })
            .catch(function () {
              return null;
            });
        }
        // ---- what is behind a door ---------------------------------------------
        // A program runs in a sandboxed frame on the tube, under the scan lines. It
        // talks to the terminal only by message: a sound to make, or that it is done.
        var app = null;
        var SOUNDS = ["beep", "clack", "dial", "floppy", "key", "snow", "song", "stopSong", "tune"];
        function launch(html) {
          app = document.createElement("iframe");
          app.className = "app";
          app.title = "Program";
          app.setAttribute("sandbox", "allow-scripts allow-popups allow-popups-to-escape-sandbox");
          app.srcdoc = html;
          app.addEventListener("load", function () {
            if (app) app.focus();
          });
          document.querySelector(".crt").appendChild(app);
          root.classList.add("running");
        }
        function quit() {
          if (!app) return;
          CRT.stopSong();
          root.classList.remove("running");
          app.remove();
          app = null;
          done();
        }
        addEventListener("message", function (e) {
          if (!app || e.source !== app.contentWindow || !e.data || typeof e.data !== "object") return;
          var m = e.data;
          if (SOUNDS.indexOf(m.sound) >= 0) CRT[m.sound].apply(null, Array.isArray(m.args) ? m.args : []);
          if (m.quit) quit();
        });
        function grant(entry) {
          misses = 0;
          put("sessionStorage", "term:misses", misses);
          if (entry.app) return launch(entry.app);
          steps(
            (entry.lines || []).map(function (l) {
              return function () {
                print(l);
              };
            }),
            260,
            function () {
              if (entry.go) setTimeout(function () { location.href = entry.go; }, reduced ? 0 : 900);
              else done();
            }
          );
        }

        // ---- ten wrong commands, or three wrong passwords -------------------------
        function deny(said) {
          misses++;
          put("sessionStorage", "term:misses", misses);
          if (misses < LIMIT) {
            print(said + ": ", DENIED[(misses - 1) % DENIED.length]);
            CRT.beep();
            return done();
          }
          print(said + ": ", "PERMISSION DENIED.").appendChild(document.createTextNode("...and..."));
          magic();
        }
        // the screen fills with it, as it did for Nedry, and then the clip
        function magic() {
          busy = true;
          form.classList.add("busy");
          print(MAGIC, "", "magic");
          var flood = [];
          for (var i = 0; i < 80; i++) {
            flood.push(function () {
              print(MAGIC, "", "magic").setAttribute("aria-hidden", "true");
            });
          }
          setTimeout(function () {
            steps(flood, 30, function () {
              setTimeout(play, reduced ? 0 : 500);
            });
          }, reduced ? 0 : 700);
        }
        // The clip loops until its window is closed; under reduced motion it waits
        // for its play button.
        function play() {
          clip.classList.toggle("still", reduced);
          clip.showModal();
          film.currentTime = 0;
          if (reduced) return;
          film.muted = false;
          film.play().catch(function () {
            film.muted = true;
            film.play().catch(function () {});
          });
        }
        clip.querySelector(".start").addEventListener("click", function () {
          clip.classList.remove("still");
          film.play().catch(function () {});
        });
        clip.querySelector(".shut").addEventListener("click", function () {
          clip.close();
        });
        clip.addEventListener("close", function () {
          film.pause();
          misses = 0;
          put("sessionStorage", "term:misses", misses);
          log.textContent = "";
          banner();
          done();
        });

        // ---- typing --------------------------------------------------------------
        function done() {
          busy = false;
          form.classList.remove("busy");
          prompt.textContent = ps1();
          mirror();
          input.focus();
        }
        function run(said) {
          var bits = said.split(/\s+/);
          var name = bits[0].toLowerCase().replace(/^\.\//, "");
          if (COMMANDS[name]) {
            // a command that takes its time says so, and calls done() itself
            if (COMMANDS[name](bits.slice(1)) !== LATER) done();
            return;
          }
          if (SAYINGS[name]) {
            say(SAYINGS[name]);
            return done();
          }
          deny(said);
        }
        // A password is never kept, echoed or remembered, and none is right.
        function password() {
          var a = asking;
          print(a.ask);
          a.left--;
          CRT.beep();
          if (a.left > 0) {
            say(a.again);
            return done();
          }
          asking = null;
          say(a.last);
          magic();
        }
        form.addEventListener("submit", function (e) {
          e.preventDefault();
          if (busy) return;
          if (asking) {
            input.value = "";
            return password();
          }
          var said = input.value.trim();
          input.value = "";
          mirror();
          print(ps1() + said);
          if (!said) return;
          history.push(said);
          back = history.length;
          busy = true;
          form.classList.add("busy");
          // the doors first, so a door's words may look like anything
          unseal(normalise(said)).then(function (entry) {
            if (entry) grant(entry);
            else run(said);
          });
        });
        input.addEventListener("input", function () {
          offer = null;
          mirror();
        });
        document.addEventListener("selectionchange", mirror);
        input.addEventListener("keydown", function (e) {
          if (e.key.length === 1 || e.key === "Backspace" || e.key === "Enter") CRT.key();
          // Tab only completes a line that has something on it, so it never traps focus
          if (e.key === "Tab" && !asking && (offer || (input.value && !e.shiftKey))) {
            e.preventDefault();
            return complete(e.shiftKey);
          }
          if (offer && e.key === "Enter") {
            e.preventDefault();
            return take();
          }
          if (offer && e.key === "Escape") {
            input.value = offer.was;
            return take();
          }
          if (offer) take();
          if (asking && e.key === "Escape") {
            print(asking.ask + "^C");
            asking = null;
              return done();
          }
          if (asking) return;
          if (e.key === "ArrowUp" || e.key === "ArrowDown") {
            e.preventDefault();
            back = Math.max(0, Math.min(history.length, back + (e.key === "ArrowUp" ? -1 : 1)));
            input.value = history[back] || "";
            mirror();
          } else if (e.key === "Escape") {
            if (input.value) {
              input.value = "";
              mirror();
            } else location.href = "index.html";
          }
        });
        // a terminal takes its keys wherever you click on it, case included
        document.addEventListener("click", function (e) {
          if (app) return app.focus();
          if (!e.target.closest("a, dialog") && !getSelection().toString()) input.focus();
        });

        function banner() {
          steps(
            [
              function () { print("BENCH/OS 1.07"); },
              function () { print("RESTRICTED TERMINAL. AUTHORISED COMMANDS ONLY."); },
              function () { print("Type help for the commands that are enabled."); },
              function () { print(""); },
            ],
            140
          );
        }
        prompt.textContent = ps1();
        banner();
        input.focus();
        CRT.hum(true);
      })();
    </script>
